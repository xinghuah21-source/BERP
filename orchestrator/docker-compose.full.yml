services:
  postgres:
    image: postgres:15
    container_name: berp_postgres_full
    restart: always
    environment:
      POSTGRES_USER: recitation
      POSTGRES_PASSWORD: recitation
      POSTGRES_DB: recitation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_full:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: berp_redis_full
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_full:/data

  backend:
    build:
      context: ../backend
    container_name: berp_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://recitation:recitation@postgres:5432/recitation
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-here
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  ai-engine:
    build:
      context: ../ai-engine
    container_name: berp_ai_engine
    restart: always
    environment:
      ENV: prod
      EMOTION2VEC_MODEL_DIR: /app/modelscope_models/emotion2vec_base_finetuned
      XUNFEI_APP_ID: ${XUNFEI_APP_ID}
      XUNFEI_API_KEY: ${XUNFEI_API_KEY}
      XUNFEI_API_SECRET: ${XUNFEI_API_SECRET}
    ports:
      - "8001:8001"
    volumes:
      - ai_models:/app/models
      - "C:/Users/26947/.cache/modelscope/hub/models/iic/emotion2vec_base_finetuned:/app/modelscope_models/emotion2vec_base_finetuned:ro"

  websocket:
    build:
      context: ../websocket-gateway
    container_name: berp_websocket
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-here
      AI_ENGINE_URL: http://ai-engine:8001/evaluate
    depends_on:
      - redis
      - ai-engine
    ports:
      - "8002:8002"

  frontend:
    build:
      context: ../frontend
    container_name: berp_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
      - websocket
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: berp_nginx
    restart: always
    depends_on:
      - frontend
      - backend
      - websocket
      - ai-engine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data_full:
  redis_data_full:
  ai_models:
